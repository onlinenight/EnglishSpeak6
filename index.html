<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>6个月英语口语训练</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
    padding: 12px; max-width: 720px; margin: 0 auto;
  }
  .card { background:#1e293b; border-radius:16px; padding:16px; margin-bottom:12px; }
  .header { display:flex; justify-content:space-between; align-items:center; }
  .day-badge { background:#3b82f6; color:#fff; padding:4px 12px; border-radius:20px; font-size:13px; font-weight:600; }
  .streak { color:#f59e0b; font-size:13px; font-weight:600; }
  h1 { font-size:18px; margin:8px 0 4px; }
  .subtitle { color:#94a3b8; font-size:13px; }
  .progress-bar { height:8px; background:#334155; border-radius:4px; margin-top:12px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#3b82f6,#22c55e); border-radius:4px; transition:width .5s; }
  .step-title { font-size:15px; font-weight:600; color:#60a5fa; margin-bottom:8px; }
  .step-time { font-size:12px; color:#94a3b8; }
  .core-sentence { background:#0f172a; border-left:3px solid #3b82f6; padding:10px 12px; border-radius:8px; margin:6px 0; font-size:15px; line-height:1.6; }
  .core-sentence .en { color:#e2e8f0; }
  .core-sentence .cn { color:#94a3b8; font-size:12px; margin-top:2px; }
  .btn {
    display:block; width:100%; padding:14px; border:none; border-radius:12px;
    font-size:16px; font-weight:600; cursor:pointer; margin-top:10px;
    transition: all .2s;
  }
  .btn-primary { background:#3b82f6; color:#fff; }
  .btn-primary:active { background:#2563eb; transform:scale(.98); }
  .btn-record { background:#ef4444; color:#fff; font-size:18px; padding:20px; }
  .btn-record.recording { background:#dc2626; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  .btn-secondary { background:#334155; color:#e2e8f0; }
  .btn-success { background:#22c55e; color:#fff; }
  .chat-box { max-height:400px; overflow-y:auto; margin-bottom:12px; }
  .msg { padding:10px 14px; border-radius:12px; margin-bottom:8px; font-size:15px; line-height:1.5; max-width:85%; }
  .msg-ai { background:#334155; color:#e2e8f0; align-self:flex-start; }
  .msg-user { background:#3b82f6; color:#fff; margin-left:auto; }
  .msg-feedback { background:#1e3a2f; border:1px solid #22c55e; color:#bbf7d0; font-size:13px; }
  .feedback-item { margin:4px 0; }
  .feedback-label { color:#86efac; font-weight:600; }
  .hidden { display:none; }
  .task-list { list-style:none; }
  .task-list li { padding:8px 0; border-bottom:1px solid #334155; font-size:14px; display:flex; align-items:center; gap:8px; }
  .task-list li:last-child { border-bottom:none; }
  .check { width:20px; height:20px; border-radius:50%; border:2px solid #475569; display:inline-flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
  .check.done { background:#22c55e; border-color:#22c55e; color:#fff; }
  .xp-bar { display:flex; justify-content:space-between; font-size:12px; color:#94a3b8; margin-top:6px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab { flex:1; padding:8px; text-align:center; border-radius:8px; background:#1e293b; font-size:13px; cursor:pointer; }
  .tab.active { background:#3b82f6; color:#fff; }
  .status { font-size:12px; color:#94a3b8; text-align:center; margin-top:6px; min-height:18px; }
  .loading { display:inline-block; width:12px; height:12px; border:2px solid #3b82f6; border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- 顶部进度 -->
<div class="card">
  <div class="header">
    <span class="day-badge" id="dayBadge">Day 1</span>
    <span class="streak" id="streak">🔥 0天</span>
  </div>
  <h1 id="monthTitle">第1月 · 敢开口·生存口语</h1>
  <p class="subtitle" id="weekTheme">第1周 · 自我介绍与寒暄</p>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="xp-bar"><span id="xpText">0 XP</span><span id="progressText">0/180天</span></div>
</div>

<!-- 今日任务 -->
<div class="card">
  <div class="step-title">🎯 今日任务</div>
  <ul class="task-list" id="taskList"></ul>
</div>

<!-- 核心句 -->
<div class="card" id="coreSentenceCard">
  <div class="step-title">📝 今日核心句</div>
  <div id="coreSentences"></div>
  <button class="btn btn-secondary" id="playAllBtn">🔊 全部朗读</button>
</div>

<!-- 对话区 -->
<div class="card">
  <div class="step-title">💬 和AI对话练习</div>
  <div class="chat-box" id="chatBox"></div>
  <div class="status" id="status"></div>
  <button class="btn btn-record" id="recordBtn">🎤 按住说话</button>
  <button class="btn btn-secondary" id="skipBtn">跳过这句 / 让AI先说</button>
  <button class="btn btn-primary" id="nextStepBtn" style="margin-top:12px;">下一步 →</button>
</div>

<!-- 复盘 -->
<div class="card" id="reviewCard">
  <div class="step-title">📊 今日复盘</div>
  <div id="reviewContent">
    <p class="subtitle">完成对话后，点击下方按钮生成复盘报告。</p>
  </div>
  <button class="btn btn-success" id="reviewBtn">生成复盘报告</button>
  <button class="btn btn-primary" id="finishBtn">✅ 完成今日打卡</button>
</div>

<script src="config.js"></script>
<script src="curriculum.js"></script>
<script src="app.js"></script>
</body>
</html>
